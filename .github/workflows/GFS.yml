name: Update GFS Weather Model Images

on:
  schedule:
    - cron: '*/60 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
            pip install herbie-data matplotlib imageio numpy cartopy
            pip install -r ./requirements.txt || true

      - name: Produce GFS Model Images
        run: python ./scripts/GFSScript.py

      - name: Commit model images and docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/models/
          git add docs/models/latest_runs.txt
          git commit -m "Update GFS model images: $(date)" || exit 0
          git push
