name: SPC Maps

on:
  schedule:
    - cron: '15 1,12,13,20 * * *'   # runs at 01:15, 12:15, 13:15, 20:15 UTC
    - cron: '45 16 * * *'           # runs at 16:45 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # 3️⃣ Install minimal system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            python3-pip \
            build-essential \
            libgeos-dev \
            libproj-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libblas-dev \
            liblapack-dev

      # 4️⃣ Upgrade pip and install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5️⃣ Run radar map script
      - name: Run SPC Map Script
        run: python scripts/spc.py

      # 6️⃣ Commit and push radar map
      - name: Commit and push radar map
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/spc/spc1.png
          git add docs/spc/spc2.png
          git add docs/spc/spc3.png
          git commit -m "Update the Latest SPC Map." || echo "No changes to commit"
          git pull --rebase origin master
          git push origin HEAD:master
        continue-on-error: true
